<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">systems-of-models</title>
  <desc id="d">A cheap System 1 decision answers first; unsure answers escalate to a reasoning model; repeated reasoning is compiled back into new System 1 questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#18213f"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="56" font-weight="700" fill="#f8fafc">systems-of-models</text>
    <text x="64" y="148" font-size="24" fill="#cbd5e1">Ask a cheap System 1 first. Escalate when unsure.</text>
    <text x="64" y="180" font-size="24" fill="#cbd5e1">Compile the reasoning your agent keeps repeating.</text>
    <text x="64" y="214" font-size="16" fill="#b4c2d7">typed decisions · measured escalation · one envelope for cost, latency and traces</text>

    <!-- request -->
    <rect x="64" y="276" width="150" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="139" y="314" font-size="18" fill="#e2e8f0" text-anchor="middle">request</text>
    <line x1="214" y1="308" x2="278" y2="308" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- S1 -->
    <rect x="282" y="268" width="250" height="80" rx="14" fill="url(#s1)"/>
    <text x="407" y="302" font-size="20" font-weight="700" fill="#052e16" text-anchor="middle">System 1 · decision</text>
    <text x="407" y="328" font-size="15" fill="#052e16" text-anchor="middle">typed answer + probability</text>

    <!-- serve -->
    <line x1="532" y1="292" x2="640" y2="292" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="586" y="282" font-size="14" fill="#86efac" text-anchor="middle">p ≥ τ: serve</text>
    <rect x="644" y="268" width="130" height="48" rx="12" fill="#1e293b" stroke="#22c55e"/>
    <text x="709" y="298" font-size="17" fill="#e2e8f0" text-anchor="middle">answer</text>

    <!-- escalate -->
    <path d="M532,328 C600,328 600,372 680,372 L820,372" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="640" y="392" font-size="14" fill="#a5b4fc" text-anchor="middle">p &lt; τ: escalate</text>
    <rect x="824" y="332" width="250" height="56" rx="14" fill="url(#s2)"/>
    <text x="949" y="366" font-size="19" font-weight="700" fill="#eef2ff" text-anchor="middle">System 2 · reasoning</text>
    <path d="M949,332 L949,292 L778,292" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1074,348 C1190,348 1190,248 1040,248 L520,248 C470,248 432,252 420,262" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowAmber)"/>
    <text x="1180" y="236" font-size="15" fill="#fbbf24" text-anchor="end">compile repeated judgements → new System 1 questions</text>
  </g>
</svg>
