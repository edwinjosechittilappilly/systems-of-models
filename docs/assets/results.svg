<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Banking77: accuracy and cost</title>
  <desc id="desc">Test accuracy and list-price cost relative to S2. S2 84.8%, 1.000; Jev 79.8%, 0.050; Decisions 79.2%, 0.070; Jev gate 82.2%, 0.139; Decisions gate 81.7%, 0.165; supervised classifier 93.2%, cost unknown.</desc>
  <rect width="1100" height="410" rx="20" fill="#0f172a"/>
  <g font-family="Arial, sans-serif" fill="#f8fafc">
    <text x="35" y="45" font-size="25" font-weight="bold">Banking77 · accuracy and cost</text>
    <text x="35" y="73" font-size="15" fill="#cbd5e1">Test accuracy; usage-weighted list-price cost relative to S2-only</text>
    <text x="270" y="112" font-size="15" fill="#cbd5e1">Accuracy</text>
    <text x="750" y="112" font-size="15" fill="#cbd5e1">Cost / S2</text>
    <g font-size="16">
      <text x="35" y="153">S2 only</text><text x="35" y="193">Jev only</text><text x="35" y="233">Decisions only</text><text x="35" y="273">Jev gate</text><text x="35" y="313">Decisions gate</text><text x="35" y="353">Supervised classifier</text>
    </g>
    <g fill="#263449"><rect x="270" y="136" width="380" height="22" rx="5"/><rect x="270" y="176" width="380" height="22" rx="5"/><rect x="270" y="216" width="380" height="22" rx="5"/><rect x="270" y="256" width="380" height="22" rx="5"/><rect x="270" y="296" width="380" height="22" rx="5"/><rect x="270" y="336" width="380" height="22" rx="5"/></g>
    <g fill="#34d399"><rect x="270" y="136" width="322.2" height="22" rx="5"/><rect x="270" y="176" width="303.2" height="22" rx="5"/><rect x="270" y="216" width="301.0" height="22" rx="5"/><rect x="270" y="256" width="312.4" height="22" rx="5"/><rect x="270" y="296" width="310.5" height="22" rx="5"/><rect x="270" y="336" width="354.2" height="22" rx="5"/></g>
    <g font-size="16" font-weight="bold"><text x="665" y="153">84.8%</text><text x="665" y="193">79.8%</text><text x="665" y="233">79.2%</text><text x="665" y="273">82.2%</text><text x="665" y="313">81.7%</text><text x="665" y="353">93.2%</text></g>
    <g fill="#818cf8"><rect x="750" y="136" width="220" height="22" rx="5"/><rect x="750" y="176" width="11" height="22" rx="5"/><rect x="750" y="216" width="15.4" height="22" rx="5"/><rect x="750" y="256" width="30.6" height="22" rx="5"/><rect x="750" y="296" width="36.3" height="22" rx="5"/></g>
    <g font-size="15"><text x="990" y="153">1.000×</text><text x="990" y="193">0.050×</text><text x="990" y="233">0.070×</text><text x="990" y="273">0.139×</text><text x="990" y="313">0.165×</text><text x="750" y="353" fill="#cbd5e1">Unknown (not measured)</text></g>
    <text x="35" y="391" font-size="13" fill="#cbd5e1">Selected gates did not meet the non-inferiority target. See the linked E1 analysis for methods and limitations.</text>
  </g>
</svg>
